<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 64" width="190" height="64" role="img" aria-label="Atlas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Atlas</title>
  <defs>
    <clipPath id="globe"><circle cx="32" cy="32" r="28"/></clipPath>
  </defs>

  <!-- Globe -->
  <circle cx="32" cy="32" r="28" fill="#51CBCB" fill-opacity="0.15"/>
  <g clip-path="url(#globe)" fill="none" stroke="#51CBCB" stroke-width="2" stroke-linecap="round">
    <!-- simple continent outlines -->
    <path d="M10 20 C16 14, 24 17, 27 9 C29 5, 33 5, 35 3"/>
    <path d="M47 7 C46 14, 51 18, 56 16 C59 15, 60 18, 61 21"/>
    <path d="M6 30 C10 34, 9 40, 14 42"/>
  </g>
  <!-- Flight path -->
  <path d="M9 41 C20 55, 42 55, 55 42" fill="none" stroke="#51CBCB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.1 4.6"/>
  <!-- Globe outline -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#51CBCB" stroke-width="3"/>

  <!-- Airplane -->
  <g transform="translate(35 28) rotate(45) scale(1.05)" fill="#51CBCB">
    <path d="M0 -14 C1.8 -14 2.8 -12 2.8 -9 L2.8 -3 L14 4 L14 7.5 L2.8 4.5 L2.8 9.5 L6.5 12.5 L6.5 14.5 L0 12.8 L-6.5 14.5 L-6.5 12.5 L-2.8 9.5 L-2.8 4.5 L-14 7.5 L-14 4 L-2.8 -3 L-2.8 -9 C-2.8 -12 -1.8 -14 0 -14 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="44" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#FFFFFF">Atlas</text>
</svg>
